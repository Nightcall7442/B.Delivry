name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build all packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Prisma client is generated code: tsc in apps/api needs it before it can typecheck or build.
      - name: Generate Prisma client
        run: pnpm --filter @bazar/api exec prisma generate

      - name: Build
        run: pnpm build

  docker-api:
    name: Docker build (api) — no push
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build API image (validation only, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: bazar-delivery/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # NOTE: no production deployment in this stage (see docs/deployment/README.md)
