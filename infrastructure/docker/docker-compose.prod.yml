# Production composition — TEMPLATE. Do not run without reviewing docs/deployment.
name: bazar-delivery-prod

services:
  api:
    image: ${API_IMAGE:-bazar-delivery/api:latest}
    restart: always
    env_file: [.env]           # provided by deploy pipeline / secret manager, never committed
    expose: ["4000"]
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on: [api]

